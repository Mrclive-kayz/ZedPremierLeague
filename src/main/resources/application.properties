spring.application.name=zedPremierLeague

# PostgreSQL (override with environment variables; no password default on purpose)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/zedpl}
spring.datasource.username=${DB_USERNAME:zedpl}
spring.datasource.password=${DB_PASSWORD}

# Flyway owns the schema; Hibernate only validates it
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Web server
server.port=8080

# Jackson: serialise dates as ISO-8601 strings, not arrays; omit null fields
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null
